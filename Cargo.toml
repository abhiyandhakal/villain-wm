[package]
name = "villain"
version = "0.1.0"
edition = "2024"
description = "A tiling-first Wayland compositor and window manager for the Abhi Desktop Environment"
license = "MIT"

[workspace]
members = ["crates/villain-ipc", "crates/villainctl"]
resolver = "3"

[dependencies]
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_udev",
    "backend_libinput",
    "backend_session_libseat",
    "desktop",
    "wayland_frontend",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xcursor = "0.3.11"
villain-ipc = { path = "crates/villain-ipc" }
serde_json = "1"
