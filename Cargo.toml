[package]
name = "villain"
version = "0.1.0"
edition = "2024"
description = "A small compositor built while learning Smithay"
license = "MIT"

[dependencies]
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_winit",
    "desktop",
    "wayland_frontend",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
