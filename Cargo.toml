[package]
name = "villain"
version = "0.1.0"
edition = "2024"
description = "A tiling-first Wayland compositor and window manager for the Knave Desktop Environment"
license = "MIT"

[workspace]
members = ["crates/villain-ipc", "crates/villainctl"]
resolver = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_udev",
    "backend_libinput",
    "backend_session_libseat",
    "desktop",
    "wayland_frontend",
    "xwayland",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xcursor = "0.3.11"
villain-ipc = { path = "crates/villain-ipc" }
serde_json = "1"

[dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
